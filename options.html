<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FullPageShot Settings</title>
  <style>
    :root {
      color-scheme: light dark;
      --accent: #6C3ED5;
      --accent-deep: #5326BC;
      --accent-light: #A07CF1;
      --grad: linear-gradient(135deg, #A07CF1, #5326BC);
      --bg: #f6f6f9;
      --surface: #ffffff;
      --surface-2: #faf9fe;
      --text: #202124;
      --text-2: #5f6368;
      --border: #dadce0;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
      --ring: rgba(108,62,213,.35);
      --warn: #b3261e;
      --warn-bg: #fdf3f2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202124;
        --surface: #292a2d;
        --surface-2: #2d2833;
        --text: #e8eaed;
        --text-2: #9aa0a6;
        --border: #3c4043;
        --shadow: 0 1px 3px rgba(0,0,0,.4);
        --ring: rgba(160,124,241,.45);
        --warn: #f2b8b5;
        --warn-bg: #3a2a2a;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }
    header img {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      box-shadow: var(--shadow);
      flex: 0 0 auto;
    }
    header .titles { min-width: 0; }
    header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }
    header p {
      margin: 2px 0 0;
      color: var(--text-2);
      font-size: 13px;
    }
    section { margin-bottom: 28px; }
    .section-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-2);
      margin: 0 0 10px 2px;
    }
    fieldset {
      border: 0;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .opt {
      display: flex;
      gap: 13px;
      padding: 15px 16px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: border-color .15s ease, background .15s ease;
    }
    .opt:hover { border-color: var(--accent-light); }
    .opt:has(input[type="radio"]:focus-visible) { outline: 2px solid var(--ring); outline-offset: 2px; }
    .opt:has(input[type="radio"]:checked) {
      border-color: var(--accent);
      background: var(--surface-2);
    }
    .opt input[type="radio"] {
      appearance: none;
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      margin: 1px 0 0;
      border: 2px solid var(--border);
      border-radius: 50%;
      flex: 0 0 auto;
      cursor: pointer;
      position: relative;
      transition: border-color .15s ease;
    }
    .opt input[type="radio"]:checked { border-color: var(--accent); }
    .opt input[type="radio"]:checked::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: var(--grad);
    }
    /* Toggle switch (checkbox) */
    .opt.toggle { align-items: center; }
    .switch { position: relative; flex: 0 0 auto; width: 42px; height: 24px; margin-left: 4px; }
    .switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
    .switch .slider { position: absolute; inset: 0; background: var(--border); border-radius: 999px; transition: background .15s ease; }
    .switch .slider::before {
      content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px;
      border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3);
      transition: transform .15s ease;
    }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::before { transform: translateX(18px); }
    .switch input:focus-visible + .slider { outline: 2px solid var(--ring); outline-offset: 2px; }
    /* Subfolder text input (inside the subfolder option) */
    .subfolder-input {
      margin-top: 10px;
      width: 100%;
      max-width: 280px;
      padding: 7px 10px;
      font: inherit;
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      outline: none;
    }
    .subfolder-input:focus { border-color: var(--accent); }
    .subfolder-input::placeholder { color: var(--text-2); }
    .subfolder-hint { display: block; margin-top: 6px; font-size: 12px; color: var(--text-2); }
    .opt .body { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
    .opt .name {
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .badge-default {
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      border-radius: 5px;
      padding: 1px 6px;
    }
    .opt .desc {
      margin: 4px 0 0;
      color: var(--text-2);
      font-size: 13px;
      text-wrap: pretty;
    }
    .saved {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--accent);
      opacity: 0;
      transition: opacity .2s ease;
    }
    .saved.show { opacity: 1; }
    .saved svg { width: 15px; height: 15px; }
    /* Keyboard shortcut status card */
    .shortcut {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      padding: 15px 16px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }
    .shortcut.unset { border-color: var(--warn); background: var(--warn-bg); }
    .shortcut .body { min-width: 0; flex: 1 1 260px; }
    .shortcut .name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .shortcut .desc { margin: 4px 0 0; color: var(--text-2); font-size: 13px; text-wrap: pretty; }
    kbd {
      font: 600 13px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: 6px;
      background: var(--surface-2);
      color: var(--text);
    }
    .badge-warn {
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--warn);
      background: color-mix(in srgb, var(--warn) 14%, transparent);
      border-radius: 5px;
      padding: 1px 6px;
    }
    .btn {
      flex: 0 0 auto;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      background: var(--grad);
      border: 0;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
    footer {
      margin-top: 34px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--text-2);
      font-size: 12.5px;
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img src="icons/icon-128.png" alt="FullPageShot">
      <div class="titles">
        <h1>FullPageShot</h1>
        <p>Full-page screenshots of your current tab</p>
      </div>
    </header>

    <section>
      <p class="section-label">Keyboard shortcut</p>
      <div class="shortcut" id="shortcutCard">
        <span class="body">
          <span class="name" id="shortcutName">Capture shortcut <kbd id="shortcutKey">…</kbd></span>
          <span class="desc" id="shortcutDesc">Press it on any page to capture it. The toolbar button does the same.</span>
        </span>
        <button type="button" class="btn" id="shortcutBtn">Change shortcut</button>
      </div>
    </section>

    <section>
      <p class="section-label">Capture mode</p>
      <fieldset>
        <legend>Capture mode</legend>

        <label class="opt">
          <input type="radio" name="captureMode" value="faithful">
          <span class="body">
            <span class="name">Faithful <span class="badge-default">Default</span></span>
            <span class="desc">Capture the page the way it looks. Carousels and sliders stay on the slide that is showing, so the image matches what you see on screen.</span>
          </span>
        </label>

        <label class="opt">
          <input type="radio" name="captureMode" value="everything">
          <span class="body">
            <span class="name">Everything</span>
            <span class="desc">Expand large carousels and sliders so more of their off-screen items are laid out in the image. Good for archiving as much of a page's content as possible in one capture, even though it looks wider than the live page.</span>
          </span>
        </label>
      </fieldset>
      <div style="margin-top:12px; height:18px;">
        <span class="saved" id="saved">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          Saved
        </span>
      </div>
    </section>

    <section>
      <p class="section-label">Save location</p>
      <fieldset>
        <legend>Save location</legend>

        <label class="opt">
          <input type="radio" name="saveLocation" value="downloads">
          <span class="body">
            <span class="name">Downloads folder <span class="badge-default">Default</span></span>
            <span class="desc">Save straight to your Downloads folder with an automatic file name.</span>
          </span>
        </label>

        <label class="opt">
          <input type="radio" name="saveLocation" value="subfolder">
          <span class="body">
            <span class="name">Downloads subfolder</span>
            <span class="desc">Always save into a subfolder of Downloads, with no prompt. For example, "Screenshots" saves to Downloads/Screenshots.</span>
            <input type="text" id="saveSubfolder" class="subfolder-input" placeholder="Screenshots" spellcheck="false" autocomplete="off" aria-label="Downloads subfolder name">
            <span class="subfolder-hint">Relative to Downloads. Slashes make nested folders. It cannot point outside Downloads.</span>
          </span>
        </label>

        <label class="opt">
          <input type="radio" name="saveLocation" value="ask">
          <span class="body">
            <span class="name">Ask every time</span>
            <span class="desc">Show the Save As dialog on each capture, so you can choose the folder and file name.</span>
          </span>
        </label>
      </fieldset>
    </section>

    <section>
      <p class="section-label">After capture</p>
      <label class="opt toggle">
        <span class="body">
          <span class="name">Copy file path to clipboard</span>
          <span class="desc">After saving, put the screenshot's full file path on the clipboard, so you can paste it into a terminal, an editor, or a coding agent. The PNG is always saved to Downloads either way.</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="copyPath">
          <span class="slider"></span>
        </span>
      </label>
    </section>

    <footer>
      <span>Made by <a href="https://reimagined.agency" target="_blank" rel="noopener">re:imagined</a></span>
      <span id="version"></span>
    </footer>
  </div>
  <script src="options.js"></script>
</body>
</html>
